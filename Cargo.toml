[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pdlpad/shaxmat"

[workspace.dependencies]
shakmaty = "0.30"

# Chess crates are slow without optimization; keep tests and dev builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2
