[package]
name = "shaxmat-game"
description = "Pixel-art chess against a bot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "shaxmat_game"

[[bin]]
name = "shaxmat"
path = "src/main.rs"

[dependencies]
macroquad = "0.4"
shaxmat-core = { path = "../core" }
shaxmat-engine = { path = "../engine" }
shaxmat-fx = { path = "../fx" }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }
